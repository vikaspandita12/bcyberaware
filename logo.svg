<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220">
  <defs>
    <radialGradient id="iris" cx="38%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#55eeff"/>
      <stop offset="40%" stop-color="#00aadd"/>
      <stop offset="100%" stop-color="#001e44"/>
    </radialGradient>
    <linearGradient id="shield" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#1d4a90"/>
      <stop offset="100%" stop-color="#0c2250"/>
    </linearGradient>
    <filter id="eyeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Shield outer body -->
  <path d="M100 8 L184 43 L184 120 Q181 180 100 214 Q19 180 16 120 L16 43 Z"
        fill="url(#shield)" stroke="#2e65bb" stroke-width="4" stroke-linejoin="round"/>

  <!-- Shield inner border -->
  <path d="M100 24 L170 54 L170 118 Q168 168 100 198 Q32 168 30 118 L30 54 Z"
        fill="none" stroke="#1e4e99" stroke-width="2.5"/>

  <!-- Top B-notch -->
  <path d="M83 9 Q100 1 117 9 L113 26 Q100 18 87 26 Z"
        fill="#070f22"/>

  <!-- Eye area background -->
  <ellipse cx="100" cy="112" rx="52" ry="34" fill="#081630"/>

  <!-- Upper eyelid fill -->
  <path d="M48 112 Q100 68 152 112 Z" fill="#0c1e3a"/>

  <!-- Eye outline ellipse -->
  <ellipse cx="100" cy="112" rx="52" ry="34" stroke="#2a66cc" stroke-width="2.5" fill="none"/>

  <!-- Upper eyelid curve -->
  <path d="M48 112 Q100 68 152 112" fill="none" stroke="#3077dd" stroke-width="2.5"/>

  <!-- Lower eyelid curve -->
  <path d="M48 112 Q100 156 152 112" fill="none" stroke="#3077dd" stroke-width="2.5"/>

  <!-- Iris globe with glow -->
  <circle cx="100" cy="112" r="28" fill="url(#iris)" filter="url(#eyeGlow)"/>

  <!-- Globe grid lines on iris -->
  <ellipse cx="100" cy="112" rx="15" ry="28" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1.2"/>
  <line x1="72" y1="100" x2="128" y2="100" stroke="rgba(255,255,255,0.28)" stroke-width="1"/>
  <line x1="72" y1="124" x2="128" y2="124" stroke="rgba(255,255,255,0.28)" stroke-width="1"/>

  <!-- Pupil -->
  <circle cx="100" cy="112" r="11" fill="#05101e"/>

  <!-- Specular highlight -->
  <circle cx="93.5" cy="105.5" r="4" fill="white" opacity="0.78"/>

  <!-- Network triangle nodes -->
  <line x1="76" y1="170" x2="100" y2="184" stroke="#2a66cc" stroke-width="2.2"/>
  <line x1="124" y1="170" x2="100" y2="184" stroke="#2a66cc" stroke-width="2.2"/>
  <line x1="76" y1="170" x2="124" y2="170" stroke="#2a66cc" stroke-width="2.2"/>
  <circle cx="76" cy="170" r="6" fill="#2a77dd"/>
  <circle cx="124" cy="170" r="6" fill="#2a77dd"/>
  <circle cx="100" cy="184" r="6" fill="#2a77dd"/>
</svg>
