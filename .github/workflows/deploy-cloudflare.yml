# Auto-deploy BCyberAware to Cloudflare Workers on every push to main.
# Live: https://advisory.bcyberaware.co.in/ · https://bcyberaware.vikaspandita12.workers.dev/
#
# Required GitHub secrets (repo → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — API token with "Edit" on Workers Scripts
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare dashboard → Workers → Account ID (sidebar)
#
# Optional (recommended — clears stale index.html at the edge):
#   CLOUDFLARE_ZONE_ID    — Zone ID for bcyberaware.co.in (Overview → API → Zone ID)
#   Token also needs: Zone → Cache Purge → Purge

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-bcyberaware
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker (wrangler.jsonc)
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy

      - name: Purge CDN cache for custom domain
        env:
          ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$ZONE_ID" ]; then
            echo "CLOUDFLARE_ZONE_ID not set — skip purge (add secret to refresh HTML instantly)"
            exit 0
          fi
          curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
          echo "Cache purged for zone ${ZONE_ID}"

      - name: Verify live API
        run: |
          curl -sf "https://advisory.bcyberaware.co.in/api/proxy?action=feed" | head -c 120
          echo ""
          echo "Deploy OK — site should reflect commit ${{ github.sha }}"
