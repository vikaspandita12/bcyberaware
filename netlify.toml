[build]
  publish   = "."
  functions = "netlify/functions"

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/proxy"
  status = 200

[functions]
  node_bundler = "esbuild"

# ── Scheduled refresh every 15 minutes ───────────────────────────────────────
# Keeps advisory data fresh even when nobody is visiting the site
[functions."scheduled-refresh"]
  schedule = "*/15 * * * *"
