<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BCyberAware – Live Threat Intelligence | Vikas Pandita</title>
  <meta name="description" content="Live cybersecurity threat intelligence dashboard. Real advisories from CISA KEV, NVD, and CERT-In India. Built by Vikas Pandita." />
  <meta name="author" content="Vikas Pandita" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body { background:#05080f; color:#c8d8e8; font-family:'Courier New',monospace; }
    ::-webkit-scrollbar { width:3px } ::-webkit-scrollbar-thumb { background:rgba(0,200,255,0.15) }
    a { color:inherit; text-decoration:none; }
  </style>
</head>
<body>
<div id="root">
  <div style="height:100vh;display:flex;align-items:center;justify-content:center;color:#00c8ff;font-family:monospace;font-size:12px;letter-spacing:3px;">
    LOADING BCYBERAWARE…
  </div>
</div>

<script type="text/babel">
// ─────────────────────────────────────────────────────────────────────────────
// BCyberAware | Live Threat Intelligence Dashboard
// Author  : Vikas Pandita
// Role    : Assistant CISO & Global Head of Security Architecture
// Brand   : BCyberAware – Security Intelligence for the Modern Enterprise
// Sources : CISA KEV (live) · NVD/CVE.org (live) · CERT-In India (live)
// Version : 2.0 Free | 2025 | MIT Licence
// ─────────────────────────────────────────────────────────────────────────────

const { useState, useEffect, useCallback } = React;

const PROXY  = "/.netlify/functions/proxy";
const ACCENT = "#00c8ff";
const ACCENT2= "#7b2ff7";

const SEV_S = {
  CRITICAL:{ bg:"rgba(200,0,0,0.15)",   border:"#c00000", text:"#ff4444" },
  HIGH:    { bg:"rgba(220,100,0,0.13)", border:"#dd6600", text:"#ff9944" },
  MEDIUM:  { bg:"rgba(200,170,0,0.11)", border:"#c8a000", text:"#ffd700" },
  LOW:     { bg:"rgba(0,140,70,0.11)",  border:"#008c46", text:"#00e676" },
};
const SEV_ORDER = ["CRITICAL","HIGH","MEDIUM","LOW"];

// ── Load live feed from proxy ─────────────────────────────────────────────────
async function loadFeed() {
  const r = await fetch(`${PROXY}?action=feed`);
  if (!r.ok) throw new Error(`Feed error ${r.status}`);
  return r.json();
}

// ── Sub-components ────────────────────────────────────────────────────────────
function SevBadge({ sev, small }) {
  const s = SEV_S[sev] || SEV_S.LOW;
  return (
    <span style={{ fontSize:small?8:9, fontWeight:800, letterSpacing:1.5,
      padding:small?"2px 6px":"3px 9px", background:s.bg,
      border:`1px solid ${s.border}`, color:s.text, borderRadius:2,
      whiteSpace:"nowrap", fontFamily:"monospace" }}>
      {sev}
    </span>
  );
}

function StatCard({ label, value, color, sub }) {
  return (
    <div style={{ flex:1, minWidth:85, background:"rgba(255,255,255,0.02)",
      border:"1px solid rgba(255,255,255,0.06)", borderRadius:4,
      padding:"11px 12px", textAlign:"center" }}>
      <div style={{ fontSize:26, fontWeight:900, color:color||ACCENT,
        fontFamily:"monospace", lineHeight:1 }}>{value}</div>
      <div style={{ fontSize:7.5, letterSpacing:2, color:"rgba(200,220,240,0.35)",
        textTransform:"uppercase", marginTop:5 }}>{label}</div>
      {sub && <div style={{ fontSize:8, color:"rgba(200,220,240,0.2)", marginTop:2 }}>{sub}</div>}
    </div>
  );
}

function AdvisoryCard({ adv }) {
  const s = SEV_S[adv.severity] || SEV_S.LOW;
  return (
    <div style={{ background:"rgba(5,8,15,0.9)", border:`1px solid ${s.border}22`,
      borderLeft:`3px solid ${s.border}`, borderRadius:4, padding:"13px 15px",
      marginBottom:7, boxShadow:adv.exploit_in_wild?`0 0 10px ${s.border}10`:"none" }}>
      {/* Badges */}
      <div style={{ display:"flex", gap:5, flexWrap:"wrap", alignItems:"center", marginBottom:6 }}>
        <SevBadge sev={adv.severity} small />
        {adv.exploit_in_wild && (
          <span style={{ fontSize:7.5, padding:"2px 6px", background:"rgba(200,0,0,0.15)",
            border:"1px solid #c0000055", color:"#ff4444", letterSpacing:1, fontFamily:"monospace" }}>
            ⚡ EXPLOIT IN WILD
          </span>
        )}
        {adv.middle_east_relevance === "HIGH" && (
          <span style={{ fontSize:7.5, padding:"2px 6px", background:"rgba(0,166,81,0.1)",
            border:"1px solid #00a65155", color:"#00e676", letterSpacing:1, fontFamily:"monospace" }}>
            🌍 GCC RISK
          </span>
        )}
        <a href={adv.source_url||"#"} target="_blank" rel="noopener noreferrer"
          style={{ fontSize:8, color:"rgba(200,220,240,0.3)", fontFamily:"monospace" }}>
          {adv.source} · {adv.date} ↗
        </a>
      </div>
      {/* Title */}
      <div style={{ fontSize:12.5, fontWeight:700, color:"#ddeeff",
        marginBottom:5, lineHeight:1.4 }}>{adv.title}</div>
      {/* Summary */}
      <div style={{ fontSize:11, color:"rgba(200,220,240,0.48)",
        lineHeight:1.65, marginBottom:6 }}>{adv.summary}</div>
      {/* CVE + Actor tags */}
      <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
        {adv.cve_ids?.map(c => (
          <a key={c} href={`https://nvd.nist.gov/vuln/detail/${c}`}
            target="_blank" rel="noopener noreferrer"
            style={{ fontSize:8.5, color:ACCENT, fontFamily:"monospace",
              background:"rgba(0,200,255,0.06)", padding:"2px 8px",
              border:`1px solid rgba(0,200,255,0.18)`, borderRadius:2 }}>
            {c} ↗
          </a>
        ))}
        {adv.threat_actor && (
          <span style={{ fontSize:8.5, color:"#c084fc", fontFamily:"monospace",
            background:"rgba(123,47,247,0.08)", padding:"2px 8px",
            border:"1px solid rgba(123,47,247,0.2)", borderRadius:2 }}>
            🎯 {adv.threat_actor}
          </span>
        )}
        {adv.patch_available && (
          <span style={{ fontSize:8.5, color:"#00e676", fontFamily:"monospace",
            background:"rgba(0,200,100,0.06)", padding:"2px 8px",
            border:"1px solid rgba(0,200,100,0.18)", borderRadius:2 }}>
            ✔ PATCH AVAILABLE
          </span>
        )}
      </div>
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────────────────────
function BCyberAwareDashboard() {
  const [advisories, setAdvisories] = useState([]);
  const [feedMeta,   setFeedMeta]   = useState(null);
  const [loading,    setLoading]    = useState(true);
  const [feedError,  setFeedError]  = useState(null);
  const [filterSev,  setFilterSev]  = useState("All");
  const [filterME,   setFilterME]   = useState(false);
  const [filterExp,  setFilterExp]  = useState(false);
  const [view,       setView]       = useState("feed");

  const refreshFeed = useCallback(async () => {
    setLoading(true); setFeedError(null);
    try {
      const data = await loadFeed();
      setAdvisories(data.advisories || []);
      setFeedMeta(data);
    } catch(e) {
      setFeedError("Could not reach live feed: " + e.message);
    }
    setLoading(false);
  }, []);

  useEffect(() => { refreshFeed(); }, []);

  // Filtered + sorted
  const filtered = advisories
    .filter(a => {
      if (filterSev !== "All" && a.severity !== filterSev) return false;
      if (filterME  && a.middle_east_relevance !== "HIGH") return false;
      if (filterExp && !a.exploit_in_wild)                 return false;
      return true;
    })
    .sort((a,b) => SEV_ORDER.indexOf(a.severity) - SEV_ORDER.indexOf(b.severity));

  const counts = { CRITICAL:0, HIGH:0, MEDIUM:0, LOW:0 };
  advisories.forEach(a => { if (counts[a.severity] !== undefined) counts[a.severity]++; });

  return (
    <div style={{ minHeight:"100vh", background:"#05080f" }}>
      <style>{`
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @keyframes shimmer{0%{left:-60%}100%{left:120%}}
        @keyframes glow{0%,100%{opacity:0.7}50%{opacity:1}}
        .nbtn:hover{border-color:rgba(0,200,255,0.4)!important;color:#00c8ff!important}
      `}</style>

      {/* ── Top Bar ── */}
      <div style={{ background:"rgba(0,0,0,0.65)",
        borderBottom:"1px solid rgba(0,200,255,0.08)",
        position:"sticky", top:0, zIndex:50 }}>
        <div style={{ maxWidth:1060, margin:"0 auto", padding:"0 18px",
          display:"flex", alignItems:"center", justifyContent:"space-between", height:52 }}>
          {/* Logo */}
          <div style={{ display:"flex", alignItems:"center", gap:14 }}>
            <div style={{ display:"flex", alignItems:"center", gap:9 }}>
              <div style={{ width:28, height:28, borderRadius:5,
                background:`linear-gradient(135deg,${ACCENT2},${ACCENT})`,
                display:"flex", alignItems:"center", justifyContent:"center",
                fontWeight:900, color:"#fff", fontSize:14, animation:"glow 3s infinite" }}>B</div>
              <div>
                <div style={{ fontSize:12, fontWeight:900, color:ACCENT,
                  letterSpacing:1.5, lineHeight:1 }}>BCyberAware</div>
                <div style={{ fontSize:7, color:"rgba(200,220,240,0.3)",
                  letterSpacing:1 }}>by Vikas Pandita</div>
              </div>
            </div>
            <div style={{ width:1, height:20, background:"rgba(255,255,255,0.07)" }}/>
            {/* Nav */}
            {[["feed","▦ LIVE FEED"],["sources","◎ SOURCES"],["about","◉ ABOUT"]].map(([v,l]) => (
              <button key={v} className="nbtn" onClick={() => setView(v)} style={{
                padding:"4px 10px",
                background:view===v?"rgba(0,200,255,0.08)":"transparent",
                border:`1px solid ${view===v?"rgba(0,200,255,0.3)":"rgba(255,255,255,0.06)"}`,
                color:view===v?ACCENT:"rgba(200,220,240,0.35)",
                fontSize:7.5, letterSpacing:2, cursor:"pointer",
                fontFamily:"monospace", borderRadius:2, transition:"all 0.2s" }}>{l}</button>
            ))}
          </div>
          {/* Right side */}
          <div style={{ display:"flex", alignItems:"center", gap:8 }}>
            {loading && (
              <span style={{ fontSize:7.5, color:ACCENT, letterSpacing:2,
                animation:"pulse 1.5s infinite" }}>⟳ FETCHING LIVE DATA…</span>
            )}
            {!loading && feedMeta && (
              <span style={{ fontSize:7.5, color:"rgba(200,220,240,0.22)" }}>
                Updated {feedMeta.fetched_at_human}
              </span>
            )}
            <button onClick={refreshFeed} disabled={loading} style={{
              padding:"4px 10px", background:"transparent",
              border:`1px solid rgba(0,200,255,0.22)`, color:ACCENT,
              fontSize:7.5, letterSpacing:2,
              cursor:loading?"not-allowed":"pointer",
              fontFamily:"monospace", opacity:loading?0.4:1, borderRadius:2 }}>
              ⟳ REFRESH
            </button>
          </div>
        </div>
      </div>

      <div style={{ maxWidth:1060, margin:"0 auto", padding:"18px 18px" }}>

        {/* ══════════════ LIVE FEED ══════════════ */}
        {view==="feed" && (
          <div style={{ animation:"fadeIn 0.3s ease" }}>
            {/* Stats */}
            <div style={{ display:"flex", gap:7, marginBottom:14, flexWrap:"wrap" }}>
              <StatCard label="Total Advisories" value={advisories.length} color={ACCENT}/>
              <StatCard label="Critical"          value={counts.CRITICAL}  color="#ff4444"/>
              <StatCard label="High"              value={counts.HIGH}      color="#ff9944"/>
              <StatCard label="GCC High Risk"     value={advisories.filter(a=>a.middle_east_relevance==="HIGH").length} color="#00e676" sub="Middle East"/>
              <StatCard label="Exploit in Wild"   value={advisories.filter(a=>a.exploit_in_wild).length} color="#ff4444" sub="Active"/>
            </div>

            {/* Shimmer loader */}
            {loading && (
              <div style={{ height:2, background:"rgba(0,200,255,0.06)",
                overflow:"hidden", position:"relative", borderRadius:1, marginBottom:12 }}>
                <div style={{ position:"absolute", height:"100%", width:"55%",
                  background:`linear-gradient(90deg,transparent,${ACCENT},transparent)`,
                  animation:"shimmer 1.4s infinite" }}/>
              </div>
            )}

            {/* Error */}
            {feedError && (
              <div style={{ padding:"10px 14px", background:"rgba(200,0,0,0.1)",
                border:"1px solid rgba(200,0,0,0.3)", borderRadius:3,
                marginBottom:12, fontSize:11, color:"#ff6666" }}>
                ⚠ {feedError}
              </div>
            )}

            {/* Filters */}
            <div style={{ display:"flex", gap:5, flexWrap:"wrap",
              marginBottom:12, alignItems:"center" }}>
              <span style={{ fontSize:7.5, color:"rgba(200,220,240,0.22)",
                letterSpacing:2 }}>FILTER:</span>
              {["All","CRITICAL","HIGH","MEDIUM","LOW"].map(s => {
                const ss = SEV_S[s];
                return (
                  <button key={s} onClick={() => setFilterSev(s)} style={{
                    padding:"3px 9px", fontSize:7.5, letterSpacing:1,
                    cursor:"pointer", fontFamily:"monospace",
                    background:filterSev===s?(ss?.bg||"rgba(0,200,255,0.08)"):"transparent",
                    border:`1px solid ${filterSev===s?(ss?.border||ACCENT):"rgba(255,255,255,0.08)"}`,
                    color:filterSev===s?(ss?.text||ACCENT):"rgba(200,220,240,0.3)",
                    borderRadius:2 }}>{s}</button>
                );
              })}
              <div style={{ width:1, height:12, background:"rgba(255,255,255,0.07)" }}/>
              <button onClick={() => setFilterME(!filterME)} style={{
                padding:"3px 9px", fontSize:7.5, letterSpacing:1,
                cursor:"pointer", fontFamily:"monospace",
                background:filterME?"rgba(0,166,81,0.1)":"transparent",
                border:`1px solid ${filterME?"#00a651":"rgba(255,255,255,0.08)"}`,
                color:filterME?"#00e676":"rgba(200,220,240,0.3)", borderRadius:2 }}>
                🌍 GCC / Middle East
              </button>
              <button onClick={() => setFilterExp(!filterExp)} style={{
                padding:"3px 9px", fontSize:7.5, letterSpacing:1,
                cursor:"pointer", fontFamily:"monospace",
                background:filterExp?"rgba(200,0,0,0.12)":"transparent",
                border:`1px solid ${filterExp?"#c00000":"rgba(255,255,255,0.08)"}`,
                color:filterExp?"#ff4444":"rgba(200,220,240,0.3)", borderRadius:2 }}>
                ⚡ Exploit in Wild
              </button>
              <span style={{ fontSize:7.5, color:"rgba(200,220,240,0.2)" }}>
                {filtered.length} advisories
              </span>
            </div>

            {/* Advisory cards */}
            {!loading && filtered.length === 0 && (
              <div style={{ textAlign:"center", padding:"40px 0",
                color:"rgba(200,220,240,0.25)", fontSize:11 }}>
                No advisories match the current filters.
              </div>
            )}
            {filtered.map(adv => <AdvisoryCard key={adv.id} adv={adv}/>)}
          </div>
        )}

        {/* ══════════════ SOURCES ══════════════ */}
        {view==="sources" && (
          <div style={{ maxWidth:660, margin:"0 auto", animation:"fadeIn 0.3s ease" }}>
            <div style={{ fontSize:7.5, letterSpacing:4, color:ACCENT,
              marginBottom:16, textAlign:"center" }}>INTELLIGENCE SOURCES</div>
            {[
              { name:"CISA Known Exploited Vulnerabilities", flag:"🇺🇸", status:"live",
                url:"https://www.cisa.gov/known-exploited-vulnerabilities-catalog",
                desc:"US Cybersecurity & Infrastructure Security Agency. The authoritative catalog of vulnerabilities actively exploited in the wild. Updated continuously.", color:"#e05000" },
              { name:"NVD / CVE.org", flag:"🌐", status:"live",
                url:"https://nvd.nist.gov",
                desc:"NIST National Vulnerability Database. Comprehensive CVE scoring, CVSS ratings, and affected product data for all published vulnerabilities.", color:"#8b0000" },
              { name:"CERT-In (India)", flag:"🇮🇳", status:"live",
                url:"https://www.cert-in.org.in",
                desc:"Indian Computer Emergency Response Team. Official security advisories from India's national CERT, covering enterprise software widely used across South Asia and the Middle East.", color:"#ff6b00" },
              { name:"UAE CERT", flag:"🇦🇪", status:"no_api",
                url:"https://www.tra.gov.ae",
                desc:"UAE Telecommunications & Digital Government Regulatory Authority. Advisories are published on their portal but no public machine-readable API is available.", color:"#00a651" },
              { name:"Saudi CERT (NCSC-SA)", flag:"🇸🇦", status:"no_api",
                url:"https://www.ncsc.gov.sa",
                desc:"Saudi Arabia's National Cybersecurity Authority. No public feed API. Saudi-relevant advisories are surfaced through CISA KEV and NVD coverage.", color:"#006c35" },
            ].map(src => (
              <div key={src.name} style={{ background:"rgba(255,255,255,0.02)",
                border:"1px solid rgba(255,255,255,0.06)", borderRadius:4,
                padding:"14px 16px", marginBottom:8 }}>
                <div style={{ display:"flex", justifyContent:"space-between",
                  alignItems:"flex-start", gap:10 }}>
                  <div style={{ flex:1 }}>
                    <div style={{ display:"flex", gap:8, alignItems:"center", marginBottom:6 }}>
                      <span style={{ fontSize:14 }}>{src.flag}</span>
                      <span style={{ fontSize:12.5, fontWeight:700, color:"#ddeeff" }}>{src.name}</span>
                      <span style={{ fontSize:8, padding:"2px 7px",
                        background:src.status==="live"?"rgba(0,150,70,0.12)":"rgba(200,170,0,0.1)",
                        border:`1px solid ${src.status==="live"?"#008c46":"#c8a000"}`,
                        color:src.status==="live"?"#00e676":"#ffd700",
                        fontFamily:"monospace", letterSpacing:1 }}>
                        {src.status==="live"?"● LIVE FEED":"◌ NO PUBLIC API"}
                      </span>
                    </div>
                    <div style={{ fontSize:11, color:"rgba(200,220,240,0.45)",
                      lineHeight:1.7 }}>{src.desc}</div>
                  </div>
                  <a href={src.url} target="_blank" rel="noopener noreferrer"
                    style={{ fontSize:8, color:ACCENT, fontFamily:"monospace",
                      border:`1px solid rgba(0,200,255,0.2)`, padding:"4px 10px",
                      borderRadius:2, whiteSpace:"nowrap", flexShrink:0 }}>VISIT ↗</a>
                </div>
              </div>
            ))}
            <div style={{ marginTop:14, padding:"11px 14px",
              background:"rgba(0,200,255,0.04)",
              border:"1px solid rgba(0,200,255,0.12)", borderRadius:3,
              fontSize:10.5, color:"rgba(200,220,240,0.4)", lineHeight:1.7 }}>
              ℹ The feed auto-refreshes every 6 hours. All CVE IDs link directly to NVD source records. No API key or login required.
            </div>
          </div>
        )}

        {/* ══════════════ ABOUT ══════════════ */}
        {view==="about" && (
          <div style={{ maxWidth:640, margin:"0 auto", animation:"fadeIn 0.3s ease" }}>
            <div style={{ textAlign:"center", marginBottom:26 }}>
              <div style={{ width:56, height:56, borderRadius:10,
                background:`linear-gradient(135deg,${ACCENT2},${ACCENT})`,
                display:"flex", alignItems:"center", justifyContent:"center",
                fontSize:26, fontWeight:900, color:"#fff",
                margin:"0 auto 14px" }}>B</div>
              <div style={{ fontSize:20, fontWeight:900, color:"#ddeeff",
                letterSpacing:2, marginBottom:5 }}>BCyberAware</div>
              <div style={{ fontSize:9.5, color:"rgba(200,220,240,0.3)",
                letterSpacing:2 }}>SECURITY INTELLIGENCE FOR THE MODERN ENTERPRISE</div>
            </div>
            {/* Author */}
            <div style={{ background:"rgba(255,255,255,0.02)",
              border:"1px solid rgba(0,200,255,0.1)", borderRadius:4,
              padding:"18px 20px", marginBottom:10 }}>
              <div style={{ fontSize:7.5, letterSpacing:3,
                color:"rgba(0,200,255,0.5)", marginBottom:10,
                fontFamily:"monospace" }}>AUTHOR</div>
              <div style={{ fontSize:14, fontWeight:800, color:"#ddeeff",
                marginBottom:4 }}>Vikas Pandita</div>
              <div style={{ fontSize:11, color:"rgba(200,220,240,0.4)",
                marginBottom:12 }}>
                Global Head of Security Architecture · AI Researcher · Blogger
              </div>
              <div style={{ display:"flex", gap:7, flexWrap:"wrap" }}>
                {["TOGAF 9.2","IIM Kozhikode EPGP","14+ Years Experience",
                  "Big 4 Consulting","IOC Security Architect","Security Architecture"].map(b => (
                  <span key={b} style={{ fontSize:8.5, color:ACCENT,
                    fontFamily:"monospace", background:"rgba(0,200,255,0.06)",
                    padding:"3px 9px", border:`1px solid rgba(0,200,255,0.18)`,
                    borderRadius:2 }}>{b}</span>
                ))}
              </div>
            </div>
            {/* Features */}
            <div style={{ background:"rgba(255,255,255,0.02)",
              border:"1px solid rgba(0,200,255,0.1)", borderRadius:4,
              padding:"18px 20px" }}>
              <div style={{ fontSize:7.5, letterSpacing:3,
                color:"rgba(0,200,255,0.5)", marginBottom:10,
                fontFamily:"monospace" }}>WHAT BCYBERAWARE DOES</div>
              {[
                "Live advisory feed from CISA KEV — actively exploited vulnerabilities updated daily",
                "Live critical CVEs from NVD / CVE.org — last 30 days of critical severity",
                "Live security alerts from CERT-In India — national CERT advisories",
                "GCC / Middle East relevance scoring per advisory",
                "Severity filtering — Critical, High, Medium, Low",
                "Exploit-in-Wild flag — know what is being actively attacked right now",
                "Direct CVE links to NVD source records",
                "Threat actor attribution where available",
                "Auto-refresh every 6 hours — no manual update needed",
              ].map((f,i) => (
                <div key={i} style={{ fontSize:11, color:"rgba(200,220,240,0.48)",
                  padding:"5px 0", borderBottom:"1px solid rgba(255,255,255,0.04)",
                  display:"flex", gap:8 }}>
                  <span style={{ color:ACCENT }}>▸</span>{f}
                </div>
              ))}
              <div style={{ marginTop:14, fontSize:8.5,
                color:"rgba(200,220,240,0.2)", fontFamily:"monospace" }}>
                Open source · MIT Licence · Contributions welcome
              </div>
            </div>
          </div>
        )}
      </div>

      {/* Footer */}
      <div style={{ borderTop:"1px solid rgba(255,255,255,0.04)",
        marginTop:28, padding:"13px 18px", textAlign:"center" }}>
        <div style={{ fontSize:8, color:"rgba(200,220,240,0.18)", letterSpacing:1.5 }}>
          BCyberAware · Vikas Pandita · {new Date().getFullYear()} · MIT Licence · Data: CISA KEV · NVD · CERT-In India
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<BCyberAwareDashboard />);
</script>
</body>
</html>
