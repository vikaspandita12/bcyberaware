<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BCyberAware – Live Threat Intelligence | Vikas Pandita</title>
  <meta name="description" content="Live cybersecurity threat intelligence. Real advisories from CISA, NVD, NCSC UK, CERT-In, Exploit-DB, The Hacker News and more. Built by Vikas Pandita." />
  <meta name="author" content="Vikas Pandita" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%237b2ff7'/%3E%3Cstop offset='100%25' stop-color='%2300c8ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='12' fill='url(%23g)'/%3E%3Ctext x='50%25' y='72%25' text-anchor='middle' font-family='Arial Black,sans-serif' font-weight='900' font-size='36' fill='white'%3EB%3C/text%3E%3C/svg%3E" />
  <meta property="og:title"       content="BCyberAware – Live Threat Intelligence by Vikas Pandita" />
  <meta property="og:description" content="Real-time cybersecurity advisories from CISA, NVD, NCSC UK, CERT-In, Exploit-DB, The Hacker News and more." />
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="https://bcyberawarebyvikaspandita.netlify.app/" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html{font-size:16px}
    body{background:#05080f;color:#c8d8e8;font-family:'Segoe UI',Arial,sans-serif;font-size:15px;line-height:1.6}
    ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:rgba(0,200,255,0.2)}
    a{color:inherit;text-decoration:none}
  </style>
</head>
<body>
<div id="root">
  <div style="height:100vh;display:flex;align-items:center;justify-content:center;color:#00c8ff;font-family:monospace;font-size:16px;letter-spacing:3px">
    LOADING BCYBERAWARE…
  </div>
</div>
<script type="text/babel">
// ─────────────────────────────────────────────────────────────────────────────
// BCyberAware | Live Threat Intelligence Dashboard
// Author  : Vikas Pandita | Global Head of Security Architecture
// Brand   : BCyberAware – Security Intelligence for the Modern Enterprise
// Sources : CISA KEV · CISA Alerts · NVD · CERT-In · NCSC UK ·
//           Exploit-DB · The Hacker News · Bleeping Computer · SANS ISC
// Version : 3.0 | 2025 | MIT Licence
// ─────────────────────────────────────────────────────────────────────────────

const { useState, useEffect, useCallback } = React;

const PROXY   = "/.netlify/functions/proxy";
const ACCENT  = "#00c8ff";
const ACCENT2 = "#7b2ff7";

const SEV_S = {
  CRITICAL:{ bg:"rgba(200,0,0,0.15)",   border:"#c00000", text:"#ff4444" },
  HIGH:    { bg:"rgba(220,100,0,0.13)", border:"#dd6600", text:"#ff9944" },
  MEDIUM:  { bg:"rgba(200,170,0,0.11)", border:"#c8a000", text:"#ffd700" },
  LOW:     { bg:"rgba(0,140,70,0.11)",  border:"#008c46", text:"#00e676" },
};
const SEV_ORDER = ["CRITICAL","HIGH","MEDIUM","LOW"];

async function loadFeed() {
  const r = await fetch(`${PROXY}?action=feed`);
  if (!r.ok) throw new Error(`Feed error ${r.status}`);
  return r.json();
}

// ── Components ────────────────────────────────────────────────────────────────
function SevBadge({ sev }) {
  const s = SEV_S[sev] || SEV_S.LOW;
  return (
    <span style={{
      fontSize:12, fontWeight:800, letterSpacing:1.5,
      padding:"4px 12px", background:s.bg,
      border:`1px solid ${s.border}`, color:s.text,
      borderRadius:3, whiteSpace:"nowrap", fontFamily:"monospace"
    }}>{sev}</span>
  );
}

function StatCard({ label, value, color, sub }) {
  return (
    <div style={{
      flex:1, minWidth:100, background:"rgba(255,255,255,0.02)",
      border:"1px solid rgba(255,255,255,0.07)", borderRadius:6,
      padding:"16px 14px", textAlign:"center"
    }}>
      <div style={{ fontSize:34, fontWeight:900, color:color||ACCENT,
        fontFamily:"monospace", lineHeight:1 }}>{value}</div>
      <div style={{ fontSize:11, letterSpacing:1.5, color:"rgba(200,220,240,0.4)",
        textTransform:"uppercase", marginTop:7, fontWeight:600 }}>{label}</div>
      {sub && <div style={{ fontSize:11, color:"rgba(200,220,240,0.25)", marginTop:3 }}>{sub}</div>}
    </div>
  );
}

function AdvisoryCard({ adv }) {
  const s         = SEV_S[adv.severity] || SEV_S.LOW;
  const isNews    = adv.category === "news";
  const isExploit = adv.category === "exploit";
  const borderCol = isNews ? "#1976d2" : isExploit ? "#c00000" : s.border;

  return (
    <div style={{
      background:"rgba(5,8,15,0.92)",
      border:`1px solid ${borderCol}33`,
      borderLeft:`4px solid ${borderCol}`,
      borderRadius:6, padding:"18px 20px", marginBottom:12,
      boxShadow:adv.exploit_in_wild ? `0 0 14px ${borderCol}12` : "none"
    }}>
      {/* Badges */}
      <div style={{ display:"flex", gap:7, flexWrap:"wrap", alignItems:"center", marginBottom:10 }}>
        {!isNews    && <SevBadge sev={adv.severity} />}
        {isNews     && <span style={{ fontSize:12, padding:"4px 12px",
          background:"rgba(25,118,210,0.15)", border:"1px solid #1976d255",
          color:"#64b5f6", letterSpacing:1, fontFamily:"monospace",
          borderRadius:3 }}>📰 NEWS</span>}
        {isExploit  && <span style={{ fontSize:12, padding:"4px 12px",
          background:"rgba(200,0,0,0.15)", border:"1px solid #c0000055",
          color:"#ff4444", letterSpacing:1, fontFamily:"monospace",
          borderRadius:3 }}>⚡ PUBLIC EXPLOIT</span>}
        {adv.exploit_in_wild && !isExploit && (
          <span style={{ fontSize:12, padding:"4px 12px",
            background:"rgba(200,0,0,0.15)", border:"1px solid #c0000055",
            color:"#ff4444", letterSpacing:1, fontFamily:"monospace",
            borderRadius:3 }}>⚡ EXPLOIT IN WILD</span>
        )}
        {adv.middle_east_relevance === "HIGH" && (
          <span style={{ fontSize:12, padding:"4px 12px",
            background:"rgba(0,166,81,0.1)", border:"1px solid #00a65155",
            color:"#00e676", letterSpacing:1, fontFamily:"monospace",
            borderRadius:3 }}>🌍 GCC RISK</span>
        )}
        <span style={{ fontSize:12, color:"rgba(200,220,240,0.4)" }}>
          {adv.source_flag} {adv.source} · {adv.date}
        </span>
      </div>

      {/* Title */}
      <div style={{
        fontSize:17, fontWeight:700, color:"#eef4ff",
        marginBottom:10, lineHeight:1.45
      }}>{adv.title}</div>

      {/* Summary */}
      <div style={{
        fontSize:14, color:"rgba(200,220,240,0.6)",
        lineHeight:1.75, marginBottom:12
      }}>{adv.summary}</div>

      {/* CVE + Actor + Patch tags */}
      <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginBottom:14 }}>
        {adv.cve_ids?.map(c => (
          <a key={c} href={`https://nvd.nist.gov/vuln/detail/${c}`}
            target="_blank" rel="noopener noreferrer"
            style={{
              fontSize:12, color:ACCENT, fontFamily:"monospace",
              background:"rgba(0,200,255,0.07)", padding:"4px 11px",
              border:`1px solid rgba(0,200,255,0.22)`, borderRadius:3
            }}>{c} ↗</a>
        ))}
        {adv.threat_actor && (
          <span style={{
            fontSize:12, color:"#c084fc", fontFamily:"monospace",
            background:"rgba(123,47,247,0.09)", padding:"4px 11px",
            border:"1px solid rgba(123,47,247,0.25)", borderRadius:3
          }}>🎯 {adv.threat_actor}</span>
        )}
        {adv.patch_available && !isNews && (
          <span style={{
            fontSize:12, color:"#00e676", fontFamily:"monospace",
            background:"rgba(0,200,100,0.07)", padding:"4px 11px",
            border:"1px solid rgba(0,200,100,0.22)", borderRadius:3
          }}>✔ PATCH AVAILABLE</span>
        )}
      </div>

      {/* Source verification bar */}
      <div style={{
        borderTop:"1px solid rgba(255,255,255,0.06)", paddingTop:12,
        display:"flex", alignItems:"center", justifyContent:"space-between",
        flexWrap:"wrap", gap:10
      }}>
        <span style={{ fontSize:12, color:"rgba(200,220,240,0.3)",
          fontFamily:"monospace", letterSpacing:1 }}>
          🔗 VERIFY SOURCE
        </span>
        <a href={adv.source_url || "#"} target="_blank" rel="noopener noreferrer"
          style={{
            display:"inline-flex", alignItems:"center", gap:7,
            fontSize:13, color:ACCENT, fontFamily:"monospace",
            background:"rgba(0,200,255,0.07)",
            border:`1px solid rgba(0,200,255,0.28)`,
            padding:"7px 16px", borderRadius:4,
            whiteSpace:"nowrap", fontWeight:600
          }}>
          {adv.source_flag} View on {adv.source} ↗
        </a>
      </div>
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────────────────────
function BCyberAwareDashboard() {
  const [advisories, setAdvisories] = useState([]);
  const [exploits,   setExploits]   = useState([]);
  const [news,       setNews]       = useState([]);
  const [feedMeta,   setFeedMeta]   = useState(null);
  const [loading,    setLoading]    = useState(true);
  const [feedError,  setFeedError]  = useState(null);
  const [filterSev,  setFilterSev]  = useState("All");
  const [filterME,   setFilterME]   = useState(false);
  const [filterExp,  setFilterExp]  = useState(false);
  const [view,       setView]       = useState("feed");
  const [feedTab,    setFeedTab]    = useState("advisories");

  const refreshFeed = useCallback(async () => {
    setLoading(true); setFeedError(null);
    try {
      const data = await loadFeed();
      setAdvisories(data.advisories || []);
      setExploits(data.exploits     || []);
      setNews(data.news             || []);
      setFeedMeta(data);
    } catch(e) { setFeedError("Could not reach live feed: " + e.message); }
    setLoading(false);
  }, []);

  useEffect(() => { refreshFeed(); }, []);

  const applyFilters = arr => arr
    .filter(a => {
      if (filterSev !== "All" && a.severity !== filterSev) return false;
      if (filterME  && a.middle_east_relevance !== "HIGH") return false;
      if (filterExp && !a.exploit_in_wild)                 return false;
      return true;
    })
    .sort((a,b) => SEV_ORDER.indexOf(a.severity) - SEV_ORDER.indexOf(b.severity));

  const fAdvisories = applyFilters(advisories);
  const fExploits   = applyFilters(exploits);
  const allItems    = [...advisories, ...exploits, ...news];
  const counts      = { CRITICAL:0, HIGH:0, MEDIUM:0, LOW:0 };
  advisories.forEach(a => { if (counts[a.severity]!==undefined) counts[a.severity]++; });

  // ── Replace VIDEO_ID below with your actual YouTube video ID ──────────────
  // Example: https://www.youtube.com/watch?v=ABC123  →  VIDEO_ID = "ABC123"
  const YOUTUBE_VIDEO_ID = "xNS89clz9FI";
  const YOUTUBE_CHANNEL  = "https://www.youtube.com/@BCyberAwarebyvikaspandita";

  const FEED_TABS = [
    { id:"advisories", label:`🏛️ Advisories (${advisories.length})` },
    { id:"exploits",   label:`⚡ Exploits (${exploits.length})` },
    { id:"news",       label:`📰 Security News (${news.length})` },
  ];

  const SOURCES_DATA = [
    { name:"CISA KEV",           cat:"Advisory", flag:"🇺🇸", status:"live", url:"https://www.cisa.gov/known-exploited-vulnerabilities-catalog", desc:"Actively exploited vulnerabilities — updated continuously by US CISA." },
    { name:"CISA Alerts",        cat:"Advisory", flag:"🇺🇸", status:"live", url:"https://www.cisa.gov/news-events/cybersecurity-advisories",    desc:"Full US-CERT security alerts and advisories from the US government." },
    { name:"NVD / CVE.org",      cat:"Advisory", flag:"🌐", status:"live", url:"https://nvd.nist.gov",                                          desc:"NIST National Vulnerability Database — all published CVEs with CVSS scoring." },
    { name:"CERT-In India",      cat:"Advisory", flag:"🇮🇳", status:"live", url:"https://www.cert-in.org.in",                                   desc:"India's national CERT — enterprise software advisories." },
    { name:"NCSC UK",            cat:"Advisory", flag:"🇬🇧", status:"live", url:"https://www.ncsc.gov.uk",                                      desc:"UK National Cyber Security Centre — official threat reports and guidance." },
    { name:"Exploit-DB",         cat:"Exploit",  flag:"⚡", status:"live", url:"https://www.exploit-db.com",                                   desc:"Public exploit database — proof-of-concept exploits for known vulnerabilities." },
    { name:"The Hacker News",    cat:"News",     flag:"📰", status:"live", url:"https://thehackernews.com",                                    desc:"Leading cybersecurity news — APTs, data breaches, and vulnerabilities." },
    { name:"Bleeping Computer",  cat:"News",     flag:"📰", status:"live", url:"https://www.bleepingcomputer.com",                             desc:"Breaking security news — ransomware, malware, and incident reports." },
    { name:"SANS ISC",           cat:"News",     flag:"🔍", status:"live", url:"https://isc.sans.edu",                                         desc:"SANS Internet Storm Center — daily threat intelligence and handler diaries." },
    { name:"UAE CERT",           cat:"Advisory", flag:"🇦🇪", status:"no_api", url:"https://www.tra.gov.ae",  desc:"UAE CERT advisories are published on their portal — no public machine-readable API." },
    { name:"Saudi CERT",         cat:"Advisory", flag:"🇸🇦", status:"no_api", url:"https://www.ncsc.gov.sa", desc:"Saudi CERT — no public API. GCC threats covered via CISA KEV and NVD." },
    { name:"Twitter/X Security", cat:"News",     flag:"🐦", status:"no_api", url:"https://twitter.com",     desc:"Twitter API now requires $100/month paid plan. Covered via The Hacker News and Bleeping Computer." },
  ];

  const navBtn = (v, l) => (
    <button key={v} onClick={() => setView(v)} style={{
      padding:"6px 14px",
      background:view===v?"rgba(0,200,255,0.1)":"transparent",
      border:`1px solid ${view===v?"rgba(0,200,255,0.35)":"rgba(255,255,255,0.08)"}`,
      color:view===v?ACCENT:"rgba(200,220,240,0.45)",
      fontSize:13, letterSpacing:1, cursor:"pointer",
      fontFamily:"monospace", borderRadius:4, transition:"all .2s",
      fontWeight:view===v?700:400
    }}>{l}</button>
  );

  return (
    <div style={{ minHeight:"100vh", background:"#05080f" }}>
      <style>{`
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @keyframes shimmer{0%{left:-60%}100%{left:120%}}
        @keyframes glow{0%,100%{opacity:.7}50%{opacity:1}}
        button:hover{opacity:1!important}
      `}</style>

      {/* ── Top Bar ── */}
      <div style={{ background:"rgba(0,0,0,.7)",
        borderBottom:"1px solid rgba(0,200,255,.1)",
        position:"sticky", top:0, zIndex:50 }}>
        <div style={{ maxWidth:1150, margin:"0 auto", padding:"0 24px",
          display:"flex", alignItems:"center", justifyContent:"space-between", height:70 }}>

          {/* Logo + Nav */}
          <div style={{ display:"flex", alignItems:"center", gap:20 }}>
            <div style={{ display:"flex", alignItems:"center", gap:13 }}>
              <div style={{
                width:46, height:46, borderRadius:10,
                background:`linear-gradient(135deg,${ACCENT2},${ACCENT})`,
                display:"flex", alignItems:"center", justifyContent:"center",
                fontWeight:900, color:"#fff", fontSize:24,
                fontFamily:"Arial Black,sans-serif",
                boxShadow:`0 0 22px ${ACCENT}44`, animation:"glow 3s infinite"
              }}>B</div>
              <div>
                <div style={{ fontSize:20, fontWeight:900, color:ACCENT,
                  letterSpacing:2, lineHeight:1.1,
                  fontFamily:"Arial Black,sans-serif" }}>BCyberAware</div>
                <div style={{ fontSize:11, color:"rgba(200,220,240,.45)",
                  letterSpacing:1.5, marginTop:2 }}>by Vikas Pandita</div>
              </div>
            </div>
            <div style={{ width:1, height:28, background:"rgba(255,255,255,.08)" }}/>
            <div style={{ display:"flex", gap:6 }}>
              {navBtn("feed",    "▦ Live Feed")}
              {navBtn("sources", "◎ Sources")}
              {navBtn("about",   "◉ About")}
            </div>
          </div>

          {/* Right */}
          <div style={{ display:"flex", alignItems:"center", gap:12 }}>
            {loading && (
              <span style={{ fontSize:12, color:ACCENT, letterSpacing:1.5,
                animation:"pulse 1.5s infinite", fontFamily:"monospace" }}>
                ⟳ Fetching 9 sources…
              </span>
            )}
            {!loading && feedMeta && (
              <span style={{ fontSize:12, color:"rgba(200,220,240,.3)",
                fontFamily:"monospace" }}>
                Updated {feedMeta.fetched_at_human}
              </span>
            )}
            <button onClick={refreshFeed} disabled={loading} style={{
              padding:"7px 16px", background:"transparent",
              border:`1px solid rgba(0,200,255,.3)`, color:ACCENT,
              fontSize:13, cursor:loading?"not-allowed":"pointer",
              fontFamily:"monospace", opacity:loading?.4:1,
              borderRadius:4, fontWeight:600
            }}>⟳ Refresh</button>
          </div>
        </div>
      </div>

      <div style={{ maxWidth:1150, margin:"0 auto", padding:"24px" }}>

        {/* ══════════ LIVE FEED ══════════ */}
        {view==="feed" && (
          <div style={{ animation:"fadeIn .3s ease" }}>

            {/* Stats */}
            <div style={{ display:"flex", gap:10, marginBottom:20, flexWrap:"wrap" }}>
              <StatCard label="Total Items"   value={allItems.length}   color={ACCENT}/>
              <StatCard label="Advisories"    value={advisories.length} color="#00c8ff"/>
              <StatCard label="Critical"      value={counts.CRITICAL}   color="#ff4444"/>
              <StatCard label="Exploits"      value={exploits.length}   color="#ff4444" sub="Public"/>
              <StatCard label="Security News" value={news.length}       color="#e91e63"/>
              <StatCard label="GCC High Risk" value={[...advisories,...exploits].filter(a=>a.middle_east_relevance==="HIGH").length} color="#00e676" sub="Middle East"/>
            </div>

            {/* Shimmer loader */}
            {loading && (
              <div style={{ height:3, background:"rgba(0,200,255,.07)",
                overflow:"hidden", position:"relative", borderRadius:2, marginBottom:16 }}>
                <div style={{ position:"absolute", height:"100%", width:"55%",
                  background:`linear-gradient(90deg,transparent,${ACCENT},transparent)`,
                  animation:"shimmer 1.4s infinite" }}/>
              </div>
            )}

            {/* Error */}
            {feedError && (
              <div style={{ padding:"14px 18px", background:"rgba(200,0,0,.1)",
                border:"1px solid rgba(200,0,0,.3)", borderRadius:6,
                marginBottom:16, fontSize:14, color:"#ff6666" }}>
                ⚠ {feedError}
              </div>
            )}

            {/* Feed Tabs */}
            <div style={{ display:"flex", gap:4, marginBottom:16,
              borderBottom:"1px solid rgba(255,255,255,.07)", paddingBottom:0 }}>
              {FEED_TABS.map(t => (
                <button key={t.id} onClick={() => setFeedTab(t.id)} style={{
                  padding:"10px 18px", background:"transparent", border:"none",
                  borderBottom:feedTab===t.id?`3px solid ${ACCENT}`:"3px solid transparent",
                  color:feedTab===t.id?ACCENT:"rgba(200,220,240,.45)",
                  fontSize:14, letterSpacing:0.5, cursor:"pointer",
                  fontFamily:"monospace", transition:"all .2s",
                  fontWeight:feedTab===t.id?700:400
                }}>{t.label}</button>
              ))}
            </div>

            {/* Filters */}
            {feedTab !== "news" && (
              <div style={{ display:"flex", gap:7, flexWrap:"wrap",
                marginBottom:16, alignItems:"center" }}>
                <span style={{ fontSize:12, color:"rgba(200,220,240,.3)",
                  letterSpacing:1.5, fontFamily:"monospace", fontWeight:600 }}>
                  FILTER:
                </span>
                {["All","CRITICAL","HIGH","MEDIUM","LOW"].map(s => {
                  const ss = SEV_S[s];
                  return (
                    <button key={s} onClick={() => setFilterSev(s)} style={{
                      padding:"5px 14px", fontSize:13, letterSpacing:0.5,
                      cursor:"pointer", fontFamily:"monospace",
                      background:filterSev===s?(ss?.bg||"rgba(0,200,255,.09)"):"transparent",
                      border:`1px solid ${filterSev===s?(ss?.border||ACCENT):"rgba(255,255,255,.1)"}`,
                      color:filterSev===s?(ss?.text||ACCENT):"rgba(200,220,240,.45)",
                      borderRadius:4, fontWeight:filterSev===s?700:400
                    }}>{s}</button>
                  );
                })}
                <div style={{ width:1, height:18, background:"rgba(255,255,255,.08)" }}/>
                <button onClick={() => setFilterME(!filterME)} style={{
                  padding:"5px 14px", fontSize:13, cursor:"pointer",
                  fontFamily:"monospace",
                  background:filterME?"rgba(0,166,81,.12)":"transparent",
                  border:`1px solid ${filterME?"#00a651":"rgba(255,255,255,.1)"}`,
                  color:filterME?"#00e676":"rgba(200,220,240,.45)",
                  borderRadius:4, fontWeight:filterME?700:400
                }}>🌍 GCC / Middle East</button>
                <button onClick={() => setFilterExp(!filterExp)} style={{
                  padding:"5px 14px", fontSize:13, cursor:"pointer",
                  fontFamily:"monospace",
                  background:filterExp?"rgba(200,0,0,.12)":"transparent",
                  border:`1px solid ${filterExp?"#c00000":"rgba(255,255,255,.1)"}`,
                  color:filterExp?"#ff4444":"rgba(200,220,240,.45)",
                  borderRadius:4, fontWeight:filterExp?700:400
                }}>⚡ Exploit in Wild</button>
              </div>
            )}

            {/* Cards */}
            {feedTab==="advisories" && (
              <>
                {!loading && fAdvisories.length===0 && (
                  <div style={{ textAlign:"center", padding:"50px 0",
                    color:"rgba(200,220,240,.3)", fontSize:15 }}>
                    No advisories match the current filters.
                  </div>
                )}
                {fAdvisories.map(a => <AdvisoryCard key={a.id} adv={a}/>)}
              </>
            )}
            {feedTab==="exploits" && (
              <>
                {!loading && fExploits.length===0 && (
                  <div style={{ textAlign:"center", padding:"50px 0",
                    color:"rgba(200,220,240,.3)", fontSize:15 }}>
                    No exploits match the current filters.
                  </div>
                )}
                {fExploits.map(a => <AdvisoryCard key={a.id} adv={a}/>)}
              </>
            )}
            {feedTab==="news" && (
              <>
                {!loading && news.length===0 && (
                  <div style={{ textAlign:"center", padding:"50px 0",
                    color:"rgba(200,220,240,.3)", fontSize:15 }}>
                    No news items yet.
                  </div>
                )}
                {news.map(a => <AdvisoryCard key={a.id} adv={a}/>)}
              </>
            )}
          </div>
        )}

        {/* ══════════ SOURCES ══════════ */}
        {view==="sources" && (
          <div style={{ maxWidth:780, margin:"0 auto", animation:"fadeIn .3s ease" }}>
            <div style={{ textAlign:"center", marginBottom:24 }}>
              <div style={{ fontSize:13, letterSpacing:4, color:ACCENT,
                marginBottom:8, fontFamily:"monospace" }}>INTELLIGENCE SOURCES</div>
              <div style={{ fontSize:15, color:"rgba(200,220,240,.4)" }}>
                9 live sources · auto-refreshed every 6 hours · no API key required
              </div>
            </div>
            {["Advisory","Exploit","News"].map(cat => (
              <div key={cat} style={{ marginBottom:28 }}>
                <div style={{ fontSize:13, letterSpacing:2,
                  color:"rgba(0,200,255,.6)", marginBottom:12,
                  fontFamily:"monospace", fontWeight:700,
                  borderBottom:"1px solid rgba(255,255,255,.06)", paddingBottom:8 }}>
                  {cat==="Advisory"?"🏛️":cat==="Exploit"?"⚡":"📰"} {cat.toUpperCase()} SOURCES
                </div>
                {SOURCES_DATA.filter(s=>s.cat===cat).map(src => (
                  <div key={src.name} style={{
                    background:"rgba(255,255,255,.025)",
                    border:"1px solid rgba(255,255,255,.07)",
                    borderRadius:6, padding:"16px 18px", marginBottom:10
                  }}>
                    <div style={{ display:"flex", justifyContent:"space-between",
                      alignItems:"flex-start", gap:14 }}>
                      <div style={{ flex:1 }}>
                        <div style={{ display:"flex", gap:10, alignItems:"center", marginBottom:7 }}>
                          <span style={{ fontSize:20 }}>{src.flag}</span>
                          <span style={{ fontSize:15, fontWeight:700, color:"#ddeeff" }}>{src.name}</span>
                          <span style={{
                            fontSize:11, padding:"3px 10px", letterSpacing:1,
                            fontFamily:"monospace", borderRadius:3,
                            background:src.status==="live"?"rgba(0,150,70,.12)":"rgba(200,170,0,.1)",
                            border:`1px solid ${src.status==="live"?"#008c46":"#c8a000"}`,
                            color:src.status==="live"?"#00e676":"#ffd700",
                            fontWeight:700
                          }}>
                            {src.status==="live"?"● LIVE":"◌ NO API"}
                          </span>
                        </div>
                        <div style={{ fontSize:13, color:"rgba(200,220,240,.5)",
                          lineHeight:1.75 }}>{src.desc}</div>
                      </div>
                      <a href={src.url} target="_blank" rel="noopener noreferrer"
                        style={{
                          fontSize:13, color:ACCENT, fontFamily:"monospace",
                          border:`1px solid rgba(0,200,255,.25)`,
                          padding:"7px 14px", borderRadius:4,
                          whiteSpace:"nowrap", flexShrink:0, fontWeight:600
                        }}>VISIT ↗</a>
                    </div>
                  </div>
                ))}
              </div>
            ))}
            <div style={{ padding:"14px 18px",
              background:"rgba(0,200,255,.04)",
              border:"1px solid rgba(0,200,255,.12)", borderRadius:6,
              fontSize:13, color:"rgba(200,220,240,.45)", lineHeight:1.8 }}>
              ℹ The feed auto-refreshes every 6 hours. All CVE IDs link directly to NVD source records. Every advisory card has a direct link to the original source for verification.
            </div>
          </div>
        )}

        {/* ══════════ DEMO ══════════ */}
        {view==="demo" && (
          <div style={{ maxWidth:820, margin:"0 auto", animation:"fadeIn .3s ease" }}>
            <div style={{ textAlign:"center", marginBottom:24 }}>
              <div style={{ fontSize:13, letterSpacing:4, color:ACCENT,
                marginBottom:8, fontFamily:"monospace" }}>▶ DEMO VIDEO</div>
              <div style={{ fontSize:16, fontWeight:700, color:"#ddeeff", marginBottom:6 }}>
                See BCyberAware in Action
              </div>
              <div style={{ fontSize:13, color:"rgba(200,220,240,.4)" }}>
                Watch how real advisories are fetched, filtered and explored
              </div>
            </div>

            {/* Video embed */}
            <div style={{ position:"relative", paddingBottom:"56.25%", height:0,
              borderRadius:10, overflow:"hidden",
              border:`1px solid rgba(0,200,255,.2)`,
              boxShadow:`0 0 40px rgba(0,200,255,.1)`,
              marginBottom:20, background:"#000" }}>
              {YOUTUBE_VIDEO_ID !== "YOUR_VIDEO_ID_HERE" ? (
                <iframe
                  src={`https://www.youtube.com/embed/${YOUTUBE_VIDEO_ID}?rel=0&modestbranding=1`}
                  title="BCyberAware Demo by Vikas Pandita"
                  frameBorder="0"
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                  allowFullScreen
                  style={{ position:"absolute", top:0, left:0, width:"100%", height:"100%" }}
                />
              ) : (
                <div style={{ position:"absolute", top:0, left:0, width:"100%", height:"100%",
                  display:"flex", flexDirection:"column", alignItems:"center",
                  justifyContent:"center", gap:16 }}>
                  <div style={{ fontSize:60, opacity:.4 }}>▶</div>
                  <div style={{ fontSize:14, color:"rgba(200,220,240,.4)", textAlign:"center" }}>
                    Demo video coming soon
                  </div>
                  <a href={YOUTUBE_CHANNEL} target="_blank" rel="noopener noreferrer"
                    style={{ fontSize:13, color:ACCENT, fontFamily:"monospace",
                      border:`1px solid rgba(0,200,255,.3)`,
                      padding:"8px 18px", borderRadius:4 }}>
                    Visit YouTube Channel ↗
                  </a>
                </div>
              )}
            </div>

            {/* Channel link */}
            <div style={{ background:"rgba(255,0,0,.07)",
              border:"1px solid rgba(255,0,0,.2)", borderRadius:8,
              padding:"18px 22px", display:"flex",
              alignItems:"center", justifyContent:"space-between",
              flexWrap:"wrap", gap:14 }}>
              <div>
                <div style={{ fontSize:15, fontWeight:700, color:"#ddeeff", marginBottom:4 }}>
                  🎬 BCyberAware YouTube Channel
                </div>
                <div style={{ fontSize:13, color:"rgba(200,220,240,.45)" }}>
                  Cybersecurity tutorials, threat walkthroughs and security architecture by Vikas Pandita
                </div>
              </div>
              <a href={YOUTUBE_CHANNEL} target="_blank" rel="noopener noreferrer"
                style={{ display:"inline-flex", alignItems:"center", gap:8,
                  fontSize:14, color:"#fff", fontWeight:700,
                  background:"#ff0000", padding:"10px 20px",
                  borderRadius:6, whiteSpace:"nowrap",
                  textDecoration:"none" }}>
                ▶ Subscribe
              </a>
            </div>
          </div>
        )}

        {/* ══════════ ABOUT ══════════ */}
        {view==="about" && (
          <div style={{ maxWidth:680, margin:"0 auto", animation:"fadeIn .3s ease" }}>
            <div style={{ textAlign:"center", marginBottom:30 }}>
              <div style={{
                width:70, height:70, borderRadius:14,
                background:`linear-gradient(135deg,${ACCENT2},${ACCENT})`,
                display:"flex", alignItems:"center", justifyContent:"center",
                fontSize:34, fontWeight:900, color:"#fff",
                fontFamily:"Arial Black,sans-serif",
                margin:"0 auto 16px",
                boxShadow:`0 0 35px ${ACCENT}33`
              }}>B</div>
              <div style={{ fontSize:26, fontWeight:900, color:"#ddeeff",
                letterSpacing:2, marginBottom:7,
                fontFamily:"Arial Black,sans-serif" }}>BCyberAware</div>
              <div style={{ fontSize:13, color:"rgba(200,220,240,.35)",
                letterSpacing:2 }}>SECURITY INTELLIGENCE FOR THE MODERN ENTERPRISE</div>
            </div>

            {/* Author */}
            <div style={{ background:"rgba(255,255,255,.025)",
              border:"1px solid rgba(0,200,255,.12)", borderRadius:6,
              padding:"22px 24px", marginBottom:12 }}>
              <div style={{ fontSize:12, letterSpacing:3, color:"rgba(0,200,255,.55)",
                marginBottom:12, fontFamily:"monospace", fontWeight:700 }}>AUTHOR</div>
              <div style={{ fontSize:20, fontWeight:800, color:"#ddeeff", marginBottom:5 }}>
                Vikas Pandita
              </div>
              <div style={{ fontSize:14, color:"rgba(200,220,240,.5)", marginBottom:16 }}>
                Global Head of Security Architecture · AI Researcher · Blogger
              </div>
              <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
                {["TOGAF 9.2","IIM Kozhikode EPGP","14+ Years Experience",
                  "Big 4 Consulting","IOC Security Architect","GenAI Security"].map(b => (
                  <span key={b} style={{ fontSize:12, color:ACCENT,
                    fontFamily:"monospace", background:"rgba(0,200,255,.07)",
                    padding:"5px 12px", border:`1px solid rgba(0,200,255,.2)`,
                    borderRadius:4 }}>{b}</span>
                ))}
              </div>
            </div>

            {/* Features */}
            <div style={{ background:"rgba(255,255,255,.025)",
              border:"1px solid rgba(0,200,255,.12)", borderRadius:6,
              padding:"22px 24px" }}>
              <div style={{ fontSize:12, letterSpacing:3, color:"rgba(0,200,255,.55)",
                marginBottom:12, fontFamily:"monospace", fontWeight:700 }}>
                PLATFORM CAPABILITIES
              </div>
              {[
                "9 live intelligence sources — advisories, exploits, and security news",
                "CISA KEV — actively exploited vulnerabilities updated daily by US CISA",
                "CISA Alerts — full US-CERT security advisories",
                "NVD / CVE.org — all critical CVEs from the last 30 days",
                "CERT-In India — India's national CERT security advisories",
                "NCSC UK — UK National Cyber Security Centre threat reports",
                "Exploit-DB — public proof-of-concept exploits",
                "The Hacker News — breaking cybersecurity news",
                "Bleeping Computer — ransomware, malware and incident news",
                "SANS ISC — daily threat intelligence from SANS handlers",
                "GCC / Middle East relevance scoring per advisory",
                "Source verification link on every advisory card",
                "Auto-refresh every 6 hours — always current",
              ].map((f,i) => (
                <div key={i} style={{ fontSize:14, color:"rgba(200,220,240,.55)",
                  padding:"7px 0", borderBottom:"1px solid rgba(255,255,255,.05)",
                  display:"flex", gap:10, lineHeight:1.5 }}>
                  <span style={{ color:ACCENT, flexShrink:0 }}>▸</span>{f}
                </div>
              ))}
              <div style={{ marginTop:16, fontSize:12,
                color:"rgba(200,220,240,.25)", fontFamily:"monospace" }}>
                Open source · MIT Licence · Contributions welcome on GitHub
              </div>
            </div>
          </div>
        )}
      </div>

      {/* Footer */}
      <div style={{ borderTop:"1px solid rgba(255,255,255,.05)",
        marginTop:32, padding:"18px 24px", textAlign:"center" }}>
        <div style={{ fontSize:12, color:"rgba(200,220,240,.2)", letterSpacing:1 }}>
          BCyberAware · Vikas Pandita · {new Date().getFullYear()} · MIT Licence ·
          Sources: CISA KEV · CISA Alerts · NVD · CERT-In · NCSC UK · Exploit-DB · THN · Bleeping Computer · SANS ISC
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<BCyberAwareDashboard />);
</script>
