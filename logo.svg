<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220">
  <defs>
    <radialGradient id="iris" cx="38%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#aaf6ff"/>
      <stop offset="30%" stop-color="#00d4ff"/>
      <stop offset="70%" stop-color="#0088cc"/>
      <stop offset="100%" stop-color="#003366"/>
    </radialGradient>
    <linearGradient id="shieldBody" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#2a6fd4"/>
      <stop offset="50%" stop-color="#1a4fa0"/>
      <stop offset="100%" stop-color="#0e2f6a"/>
    </linearGradient>
    <linearGradient id="shieldTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a80e8"/>
      <stop offset="100%" stop-color="#1a50a8"/>
    </linearGradient>
    <filter id="shieldGlow" x="-15%" y="-10%" width="130%" height="125%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="irisGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Shield outer glow ring -->
  <path d="M100 8 L184 43 L184 120 Q181 180 100 214 Q19 180 16 120 L16 43 Z"
        fill="none" stroke="#3d8de8" stroke-width="2" opacity="0.4" filter="url(#shieldGlow)"/>

  <!-- Shield main body -->
  <path d="M100 8 L184 43 L184 120 Q181 180 100 214 Q19 180 16 120 L16 43 Z"
        fill="url(#shieldBody)" stroke="#4a9af0" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Shield inner border -->
  <path d="M100 24 L170 54 L170 118 Q168 168 100 198 Q32 168 30 118 L30 54 Z"
        fill="none" stroke="#3380d0" stroke-width="2"/>

  <!-- Top notch (B-shape) -->
  <path d="M84 9 Q100 2 116 9 L112 25 Q100 19 88 25 Z"
        fill="#091a3e"/>

  <!-- Eye socket background -->
  <ellipse cx="100" cy="112" rx="52" ry="34" fill="#071428"/>

  <!-- Upper eyelid fill -->
  <path d="M48 112 Q100 70 152 112 Z" fill="#0a1d40"/>

  <!-- Eye outline -->
  <ellipse cx="100" cy="112" rx="52" ry="34" stroke="#4a9af0" stroke-width="2.5" fill="none"/>

  <!-- Upper eyelid curve -->
  <path d="M48 112 Q100 70 152 112" fill="none" stroke="#5aaaf8" stroke-width="2.5"/>

  <!-- Lower eyelid curve -->
  <path d="M48 112 Q100 154 152 112" fill="none" stroke="#5aaaf8" stroke-width="2.5"/>

  <!-- Iris globe with glow -->
  <circle cx="100" cy="112" r="29" fill="url(#iris)" filter="url(#irisGlow)"/>

  <!-- Globe vertical oval -->
  <ellipse cx="100" cy="112" rx="15" ry="29" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.3"/>
  <!-- Globe horizontal lines -->
  <line x1="71" y1="99" x2="129" y2="99" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <line x1="71" y1="125" x2="129" y2="125" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <!-- Globe center vertical -->
  <line x1="100" y1="83" x2="100" y2="141" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>

  <!-- Pupil -->
  <circle cx="100" cy="112" r="11" fill="#04090f"/>

  <!-- Specular highlight -->
  <circle cx="93" cy="105" r="4.5" fill="white" opacity="0.82"/>
  <circle cx="107" cy="119" r="2" fill="white" opacity="0.3"/>

  <!-- Network triangle lines -->
  <line x1="75" y1="170" x2="100" y2="185" stroke="#4a9af0" stroke-width="2.5"/>
  <line x1="125" y1="170" x2="100" y2="185" stroke="#4a9af0" stroke-width="2.5"/>
  <line x1="75" y1="170" x2="125" y2="170" stroke="#4a9af0" stroke-width="2.5"/>

  <!-- Network nodes -->
  <circle cx="75" cy="170" r="6.5" fill="#5aaaf8"/>
  <circle cx="125" cy="170" r="6.5" fill="#5aaaf8"/>
  <circle cx="100" cy="185" r="6.5" fill="#5aaaf8"/>
  <!-- Node centers -->
  <circle cx="75" cy="170" r="2.5" fill="white" opacity="0.6"/>
  <circle cx="125" cy="170" r="2.5" fill="white" opacity="0.6"/>
  <circle cx="100" cy="185" r="2.5" fill="white" opacity="0.6"/>
</svg>
